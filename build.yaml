# Eyelash Sofle is a shield on a nice!nano v2, built against ZMK v0.3.
#
# Moving to ZMK v0.4+ (Zephyr 4.1):
#   - set `revision: v0.4` in config/west.yml and `@v0.4` in .github/workflows/build.yml
#   - change every `board: nice_nano_v2` below to `board: nice_nano//zmk`
#   - swap `nice_view_custom` for `nice_view` unless GPeye/mario-peripheral-animation
#     has been updated: it uses LVGL 8 APIs that Zephyr 4.1 (LVGL 9) removed
---
include:
  - board: nice_nano_v2
    shield: eyelash_sofle_right nice_view_custom
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_studio_left
  - board: nice_nano_v2
    shield: settings_reset
